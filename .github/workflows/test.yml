name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: install dependencies
        run: npm ci
      - name: lint
        run: npm run lint
      - name: prettier check
        run: npx prettier --check "src/**/*.ts"
      - name: build
        run: npm run build
      - name: test
        run: npm run test:cov
      - name: upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
